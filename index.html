<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #f8c291, #e55039);
      text-align: center;
    }
    h1 {
      color: #fff;
      margin-top: 20px;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin: 30px;
      gap: 20px;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
      width: 250px;
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .emoji {
      font-size: 40px;
    }
    .card h2 {
      color: #e55039;
      margin: 10px 0;
    }
    .card p {
      color: #555;
      font-size: 14px;
      margin-bottom: 15px;
    }
    .card a {
      text-decoration: none;
      color: #fff;
      background: #e55039;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
    }
    .card a:hover {
      background: #b33939;
    }
  </style>
</head>
<body>
  <h1>📝 Notes Generator</h1>
  <p style="color:white;">Select which template you want to use:</p>

  <div class="container">
    <div class="card">
      <div class="emoji">📘</div>
      <h2>Daily Notes</h2>
      <p>For daily troubleshooting and case notes.</p>
      <a href="daily.html">Open Template</a>
    </div>

    <div class="card">
      <div class="emoji">🚨</div>
      <h2>Escalation</h2>
      <p>For urgent issues that need escalation details.</p>
      <a href="escalation.html">Open Template</a>
    </div>
  </div>
</body>
</html>
